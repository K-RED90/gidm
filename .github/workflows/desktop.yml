name: Desktop

# PHASE 1: validate that the Wails desktop app builds on each OS's native webview
# toolchain (it can't cross-compile). Triggered on this branch while iterating;
# before merge this becomes a tag trigger that uploads to the GitHub Release.
on:
  push:
    branches: [ci/desktop-release]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: desktop/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        # Wails v3 (alpha) targets GTK4 + WebKitGTK 6.0, needed even to build the CLI.
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Put GOPATH bin on PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.105

      - name: Build desktop app
        working-directory: desktop
        run: wails3 build

      - uses: actions/upload-artifact@v4
        with:
          name: gidm-desktop-${{ matrix.target }}
          path: desktop/bin/
          if-no-files-found: error
